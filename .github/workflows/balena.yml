name: balena

on:
  pull_request:
    types: [opened, synchronize, closed]
    branches:
      - main

jobs:
  pre_commit:
    name: Pre-commit hooks
    # The hooks already ran while the pull request was open.
    if: github.event.action != 'closed'
    uses: klutchell/renovate-config/.github/workflows/pre-commit.yml@main

  deploy:
    needs: pre_commit
    # The pre_commit job is skipped on close, so a skipped result must not block the release.
    if: always() && needs.pre_commit.result != 'failure' && needs.pre_commit.result != 'cancelled'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        fleet: [gh_klutchell/adguard-home]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: balena-io/deploy-to-balena-action@3653c472f0bb6a9885110328b28c3a80470b3b63 # v2.3.1
        with:
          balena_token: ${{ secrets.BALENA_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          environment: balena-cloud.com
          fleet: ${{ matrix.fleet }}
          versionbot: false
          create_tag: true
